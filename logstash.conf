input {
  jdbc {
    jdbc_driver_library => "${DB_JAR_PATH}"
    jdbc_driver_class => "${DB_DRIVER}"
    jdbc_connection_string => "jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
    jdbc_user => "${DB_USER}"
    jdbc_password => "${DB_PASSWORD}"

    # Run every 5 seconds
    schedule => "*/5 * * * * *"

    # Incremental query
    statement => "
      SELECT 
        id,
        created_at,
        updated_at,
        transactionTypes AS transactiontypes,
        transaction_uid,
        link_reference,
        transactionStatus AS transactionstatus,
        senderID AS senderid,
        recipientID AS recipientid,
        senderCountryCode AS sendercountrycode,
        recipientCountryCode AS recipientcountrycode,
        sendersAmount AS sendersamount,
        recipientAmount AS recipientamount,
        senderBalance AS senderbalance,
        recipientBalance AS recipientbalance,
        fee,
        exRate AS exrate,
        pricing_id,
        deviceType AS devicetype,
        dateTime AS datetime,
        completedDate AS completeddate,
        foreignId AS foreignid,
        airtimeNumber AS airtimenumber,
        airtimeChannel AS airtimechannel,
        airtimeTotalBalance AS airtimetotalbalance,
        senderBankAccount AS senderbankaccount,
        recipientBankAccount AS recipientbankaccount,
        w_sender_name,
        w_idType AS w_idtype,
        w_idnumber,
        w_idExpDate AS w_idexpdate,
        comment,
        card_id,
        billCode AS billcode,
        remitRecipientName AS remitrecipientname,
        remitRecipientMomoName AS remitrecipientmomoname,
        remitRecipientMomoNumber AS remitrecipientmomonumber,
        remitRecipientChannel AS remitrecipientchannel,
        remitRecipientBankAccountName AS remitrecipientbankaccountname,
        remitRecipientBankName AS remitrecipientbankname,
        remitRecipientBankAccount AS remitrecipientbankaccount,
        bill_type,
        purpose,
        bundlePackage AS bundlepackage,
        async_id,
        receipt,
        app_version,
        write_status,
        sdk_version,
        statusDescription AS statusdescription,
        rechargeMode AS rechargemode,
        rechargeToken AS rechargetoken,
        externalTransactionId AS externaltransactionid,
        refund_provider_id,
        provider_id,
        fund_source_id,
        auto_reverse_status
      FROM maintransaction_tbl
      WHERE updated_at >= :sql_last_value
        AND transactionStatus = 'COMPLETED'
        AND replicated = 0
        AND HOUR(NOW()) >= 1
      ORDER BY updated_at ASC
    "

    use_column_value => true
    tracking_column => "updated_at"
    tracking_column_type => "timestamp"
    last_run_metadata_path => "${DB_TRACK_FILE}"

    jdbc_paging_enabled => true
    jdbc_page_size => 1000
    clean_run => false
  }
}

filter {
  mutate {
    convert => { 
      "sendersamount"       => "float"
      "recipientamount"     => "float"
      "senderbalance"       => "float"
      "recipientbalance"    => "float"
      "fee"                 => "float"
      "airtimetotalbalance" => "float"
      "exrate"              => "float"
    }
    remove_field => ["@version", "@timestamp"]
  }
}

output {
  #  First output: insert or update to history table
  jdbc {
    driver_jar_path => "${DB_JAR_PATH}"
    driver_class => "${DB_DRIVER}"
    connection_string => "jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
    username => "${DB_USER}"
    password => "${DB_PASSWORD}"

    statement => [
      "INSERT INTO maintransaction_tbl_history
      (id, created_at, updated_at, transactiontypes, transaction_uid, link_reference, transactionstatus, senderid, recipientid, sendercountrycode, recipientcountrycode, sendersamount, recipientamount, senderbalance, recipientbalance, fee, exrate, pricing_id, devicetype, datetime, completeddate, foreignid, airtimenumber, airtimechannel, airtimetotalbalance, senderbankaccount, recipientbankaccount, w_sender_name, w_idtype, w_idnumber, w_idexpdate, comment, card_id, billcode, remitrecipientname, remitrecipientmomoname, remitrecipientmomonumber, remitrecipientchannel, remitrecipientbankaccountname, remitrecipientbankname, remitrecipientbankaccount, bill_type, purpose, bundlepackage, async_id, receipt, app_version, write_status, sdk_version, statusdescription, rechargemode, rechargetoken, externaltransactionid, refund_provider_id, provider_id, fund_source_id, auto_reverse_status)
      VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
      ON DUPLICATE KEY UPDATE
        updated_at = VALUES(updated_at),
        transactionstatus = VALUES(transactionstatus),
        sendersamount = VALUES(sendersamount),
        recipientamount = VALUES(recipientamount),
        senderbalance = VALUES(senderbalance),
        recipientbalance = VALUES(recipientbalance),
        fee = VALUES(fee),
        exrate = VALUES(exrate),
        completeddate = VALUES(completeddate),
        write_status = VALUES(write_status),
        auto_reverse_status = VALUES(auto_reverse_status);",
      
      "id", "created_at", "updated_at", "transactiontypes", "transaction_uid", "link_reference", "transactionstatus", "senderid", "recipientid", "sendercountrycode", "recipientcountrycode", "sendersamount", "recipientamount", "senderbalance", "recipientbalance", "fee", "exrate", "pricing_id", "devicetype", "datetime", "completeddate", "foreignid", "airtimenumber", "airtimechannel", "airtimetotalbalance", "senderbankaccount", "recipientbankaccount", "w_sender_name", "w_idtype", "w_idnumber", "w_idexpdate", "comment", "card_id", "billcode", "remitrecipientname", "remitrecipientmomoname", "remitrecipientmomonumber", "remitrecipientchannel", "remitrecipientbankaccountname", "remitrecipientbankname", "remitrecipientbankaccount", "bill_type", "purpose", "bundlepackage", "async_id", "receipt", "app_version", "write_status", "sdk_version", "statusdescription", "rechargemode", "rechargetoken", "externaltransactionid", "refund_provider_id", "provider_id", "fund_source_id", "auto_reverse_status"
    ]
  }

  # Second output: mark as replicated
  jdbc {
    driver_jar_path => "${DB_JAR_PATH}"
    driver_class => "${DB_DRIVER}"
    connection_string => "jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
    username => "${DB_USER}"
    password => "${DB_PASSWORD}"
    statement => ["UPDATE maintransaction_tbl SET replicated = 1 WHERE id = ?", "id"]
  }

  # Optional debug
  stdout {
    codec => rubydebug { metadata => true }
  }
}